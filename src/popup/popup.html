<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PicPick</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>PicPick</h1>
      <p id="site-info" class="site-info">--</p>
    </header>

    <main>
      <!-- スキャン結果 -->
      <section id="scan-section" class="section">
        <button id="scan-btn" class="btn btn-primary">
          画像をスキャン
        </button>
        <div id="scan-result" class="result hidden">
          <p><span id="image-count">0</span> 枚の画像</p>
          <p class="filtered-info">
            (フィルター除外: <span id="filtered-count">0</span> 枚)
          </p>
        </div>
        <p id="error-msg" class="error hidden"></p>
      </section>

      <!-- ダウンロード -->
      <section id="download-section" class="section hidden">
        <div class="creator-select-row">
          <label for="creator-select">クリエイター:</label>
          <select id="creator-select">
            <option value="">-- 選択しない --</option>
          </select>
        </div>
        <button id="download-btn" class="btn btn-success">
          一括ダウンロード
        </button>
        <div id="progress" class="progress hidden">
          <div class="progress-bar">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
          <p id="progress-text">0 / 0</p>
        </div>
        <p id="download-result" class="result-text hidden"></p>
      </section>

      <!-- 設定 -->
      <section class="section settings">
        <details>
          <summary>設定</summary>
          <div class="settings-content">
            <div class="setting-item">
              <label for="filename-template">ファイル名テンプレート</label>
              <input type="text" id="filename-template"
                     value="{date}_{title}_{index}"
                     placeholder="{date}_{title}_{index}">
              <small>変数: {date}, {title}, {creator}, {index}, {postId}, {year}, {month}, {day}, {original}</small>
            </div>

            <div class="setting-row">
              <div class="setting-item">
                <label for="min-width">最小幅 (px)</label>
                <input type="number" id="min-width" value="400" min="0">
              </div>
              <div class="setting-item">
                <label for="min-height">最小高さ (px)</label>
                <input type="number" id="min-height" value="400" min="0">
              </div>
            </div>

            <div class="setting-item">
              <label for="download-folder">保存フォルダ名</label>
              <input type="text" id="download-folder" value="PicPick" placeholder="PicPick">
            </div>

            <!-- クリエイターリスト -->
            <div class="setting-item">
              <label>クリエイターリスト</label>
              <small>ダウンロード時に選択できるクリエイター名を登録</small>
              <div id="creator-list" class="creator-list"></div>
              <div class="creator-input-row">
                <input type="text" id="new-creator" placeholder="クリエイター名" class="input-flex">
                <button id="add-creator" class="btn btn-small">追加</button>
              </div>
            </div>

            <div class="button-row">
              <button id="save-settings" class="btn btn-secondary">
                設定を保存
              </button>
              <button id="reset-settings" class="btn btn-danger">
                リセット
              </button>
            </div>
          </div>
        </details>
      </section>
    </main>

    <footer>
      <p id="status" class="status"></p>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
