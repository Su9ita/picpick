<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>picpick 設定</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="header-row">
        <h1>picpick 設定</h1>
        <label class="overlay-toggle" title="オーバーレイの表示/非表示">
          <input type="checkbox" id="overlay-enabled" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
    </header>

    <main>
      <nav class="settings-tabs" aria-label="設定カテゴリ">
        <button class="tab-btn active" data-tab="rule-settings" aria-label="サイトルール" title="サイトルール">
          <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <circle cx="8" cy="10" r="1.5" />
            <path d="m4 17 5-5 4 4 2-2 5 5" />
          </svg>
        </button>
        <button class="tab-btn" data-tab="global-settings" aria-label="共通設定" title="共通設定">
          <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5Z" />
            <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2a2 2 0 1 1-4 0V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1A2 2 0 1 1 4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H2.8a2 2 0 1 1 0-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7A2 2 0 1 1 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3h.1A1.7 1.7 0 0 0 10 3V2.8a2 2 0 1 1 4 0V3a1.7 1.7 0 0 0 1 1.6h.1a1.7 1.7 0 0 0 1.9-.3l.1-.1A2 2 0 1 1 19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1A1.7 1.7 0 0 0 21 10h.2a2 2 0 1 1 0 4H21a1.7 1.7 0 0 0-1.6 1Z" />
          </svg>
        </button>
        <button class="tab-btn" data-tab="size-settings" aria-label="サイズ条件" title="サイズ条件">
          <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16" />
            <path d="M4 17h16" />
            <path d="M8 4v6" />
            <path d="M16 14v6" />
          </svg>
        </button>
      </nav>

      <section id="rule-settings" class="tab-content active">
        <div class="setting-item">
          <label for="active-rule">サイトルール</label>
          <select id="active-rule" class="preset-select"></select>
          <small id="rule-description"></small>
        </div>

        <div class="setting-item">
          <label>このルールで使える変数</label>
          <div id="rule-variables" class="variable-list"></div>
        </div>

        <div class="setting-item">
          <label>保存名プリセット</label>
          <div id="filename-preset-list" class="item-list"></div>
        </div>

        <div class="setting-item">
          <label>新規保存名プリセット</label>
          <div class="preset-input-group stacked">
            <input type="text" id="new-filename-preset-label" placeholder="表示名">
            <input type="text" id="new-filename-preset-template" placeholder="{date}_{custom}_{index}">
            <button id="add-filename-preset" class="btn btn-small">追加</button>
          </div>
        </div>
      </section>

      <section id="global-settings" class="tab-content">
        <div class="setting-item">
          <label for="download-folder">保存フォルダ名</label>
          <input type="text" id="download-folder" value="picpick" placeholder="picpick">
        </div>

        <div class="setting-item toggle-setting-item">
          <span class="setting-label">スキャン時にスクロールする</span>
          <label class="switch-toggle" title="スキャン時にページをスクロールして追加画像を読み込む">
            <input type="checkbox" id="scan-scroll-enabled">
            <span class="toggle-slider"></span>
          </label>
        </div>

        <div class="button-row">
          <button id="save-global-settings" class="btn btn-secondary">設定を保存</button>
        </div>
      </section>

      <section id="size-settings" class="tab-content">
        <div class="setting-item">
          <label>登録済みサイズ条件</label>
          <div id="size-preset-list" class="item-list"></div>
        </div>

        <div class="setting-item">
          <label>新規サイズ条件</label>
          <div class="preset-input-group">
            <input type="text" id="new-preset-name" placeholder="プリセット名" class="input-medium">
            <input type="number" id="new-preset-width" placeholder="幅(px)" min="0" class="input-small">
            <input type="number" id="new-preset-height" placeholder="高さ(px)" min="0" class="input-small">
            <button id="add-size-preset" class="btn btn-small">追加</button>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <p id="status" class="status"></p>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
